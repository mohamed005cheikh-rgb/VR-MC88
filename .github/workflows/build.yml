name: Build VR-MC88 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Project with System Gradle
        run: |
          cd android
          gradle build --no-daemon

      - name: Upload APK Automatically
        uses: actions/upload-artifact@v4
        with:
          name: VR-MC88-APK-Output
          path: |
            **/*.apk
            !**/build-cache/**
