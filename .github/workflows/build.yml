name: Build VR-MC88 APK and EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew permissions and line endings
        run: |
          cd android
          chmod +x gradlew
          sed -i -e 's/\r$//' gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-MC88-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies directly
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller pyserial

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name="VR-MC88" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VR-MC88-Windows-EXE
          path: dist/VR-MC88.exe
