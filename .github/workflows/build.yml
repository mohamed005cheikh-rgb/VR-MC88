name: Build VR-MC88 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Repository Mode & Build APK
        run: |
          cd android
          # تجاوز قيد المستودعات الصارم لإصدارات Gradle الحديثة
          echo "org.gradle.project.android.aapt2FromMavenOverride=true" >> gradle.properties
          ./gradlew assembleDebug --no-daemon
