name: Build VR.MC88 APK and EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # --- 1. بناء تطبيق الأندرويد (APK) ---
    # --- 1. بناء تطبيق الأندرويد (APK) ---
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: VR.MC88-Android-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk


  # --- 2. بناء تطبيق الويندوز (EXE) ---
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies directly
      run: |
        cd Desktop
        python -m pip install --upgrade pip
        pip install PyQt5 pyinstaller
        
    - name: Build EXE
      run: |
        cd Desktop
        pyinstaller --onefile --windowed --name="VR.MC88" main.py
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: VR.MC88-Windows-EXE
        path: Desktop/dist/VR.MC88.exe
