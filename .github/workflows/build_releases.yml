name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*' # يعمل التجميع تلقائياً عند إنشاء إمساك أو Tag جديد مثل v1.0.0
  workflow_dispatch: # يتيح لك تشغيله يدوياً من تبويب Actions

jobs:
  # 1. بناء ملف الـ APK للأندرويد
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Gradle (APK)
        run: |
          cd Android
          if [ -f "./gradlew" ]; then chmod +x gradlew && ./gradlew assembleRelease; fi

  # 2. بناء ملف الـ EXE للوندوز
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyBluez pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: VR.MC88-Windows-EXE
          path: Desktop/dist/VR.MC88.exe
