name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Gradle (APK)
        run: |
          cd Android
          if [ -f "./gradlew" ]; then chmod +x gradlew && ./gradlew assembleRelease; fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR.MC88-Windows-EXE
          path: Desktop/dist/VR.MC88.exe
