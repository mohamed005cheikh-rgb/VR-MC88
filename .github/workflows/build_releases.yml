name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. إعداد الجافا وبناء APK للأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd Android
          if [ -f "./gradlew" ]; then chmod +x gradlew && ./gradlew assembleRelease; fi

      # 2. إعداد البايثون وبناء EXE للوندوز
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Build EXE
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      # 3. حفظ ملف APK للأندرويد
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR.MC88-Android-APK
          path: Android/app/build/outputs/apk/release/*.apk

      # 4. حفظ ملف EXE للوندوز
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR.MC88-Windows-EXE
          path: Desktop/dist/VR.MC88.exe
