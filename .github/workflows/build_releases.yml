name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 1. بناء تطبيق الويندوز (EXE) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Build EXE
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR.MC88-Windows-EXE
          path: Desktop/dist/VR.MC88.exe

      - name: Publish EXE to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Desktop/dist/VR.MC88.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 2. بناء تطبيق الأندرويد (APK) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd Android
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR.MC88-Android-APK
          path: Android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
