name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- 1. بناء تطبيق الويندوز (EXE) على سيرفر ويندوز حقيقي ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Build EXE
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      - name: Publish EXE Direct File to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Desktop/dist/VR.MC88.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 2. بناء تطبيق الأندرويد (APK) على سيرفر لينكس ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd Android
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Publish APK Direct File to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
