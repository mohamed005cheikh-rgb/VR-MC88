name: Build APK and EXE Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. إعداد الجافا وبناء APK للأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd Android
          if [ -f "./gradlew" ]; then chmod +x gradlew && ./gradlew assembleRelease; fi

      # 2. إعداد البايثون وبناء EXE للوندوز
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Build EXE
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller
          cd Desktop
          pyinstaller --onefile --noconsole --name="VR.MC88" main.py

      # 3. نشر الملفين مباشرة إلى صفحة Release (بصيغة exe و apk مباشرة)
      - name: Publish Direct Files to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Android/app/build/outputs/apk/release/*.apk
            Desktop/dist/VR.MC88.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
